<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flagship test results</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF9F8; --ink:#252427; --muted:#757470; --line:#E5E3DE; --mid:#CDC8BF;
  --violet:#6243B9; --lilac:#E5DCFF; --panel:#FFFFFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#1C1B1E; --ink:#F3F1EE; --muted:#A8A6A1; --line:#34323A; --mid:#4A4852; --violet:#9C84F0; --lilac:#2E2748; --panel:#252427; }
}
:root[data-theme="dark"]{ --bg:#1C1B1E; --ink:#F3F1EE; --muted:#A8A6A1; --line:#34323A; --mid:#4A4852; --violet:#9C84F0; --lilac:#2E2748; --panel:#252427; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.45 Figtree,"Avantt",system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-.01em}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px}

header{padding:28px clamp(16px,4vw,48px) 0}
h1{font:400 clamp(44px,8vw,88px)/.85 Anton,"FK Screamer",Impact,sans-serif;text-transform:uppercase;margin:0 0 20px;letter-spacing:0}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs button{background:none;border:0;padding:12px 14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tabs button:hover{color:var(--ink)}

main{padding:32px clamp(16px,4vw,48px) 64px}
section[hidden]{display:none}
.prose{max-width:62ch}
.prose h2{font-size:24px;font-weight:600;margin:0 0 12px;letter-spacing:-.02em}
.prose p{margin:0 0 14px}
.prose .quiet{color:var(--muted)}
.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-top:24px;max-width:860px}
.pages button{background:var(--panel);border:0;text-align:left;padding:18px;cursor:pointer}
.pages button:hover{background:var(--lilac)}
.pages strong{display:block;font-weight:600}
.pages span{color:var(--muted);font-size:14px}

.proto{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:40px;align-items:start}
.side{padding-top:8px}
.side h2{font-size:14px;font-weight:600;color:var(--muted);margin:0 0 10px}
.side h2.sechead{font-size:17px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
  color:var(--ink);margin:0 0 12px}
.side h2.sechead.spaced{margin-top:34px}
/* The screen list is supporting navigation, so it sits in a quiet neutral block
   and stays visually below the test list. */
.side h2.sechead.sub{font-size:12px;font-weight:700;letter-spacing:.09em;color:var(--muted);margin:0 0 6px}
.quietblock{margin-top:44px;background:rgba(0,0,0,.035);border:1px solid var(--line);padding:16px 16px 14px}
:root:not([data-theme="light"]) .quietblock{background:rgba(255,255,255,.04)}
.quietblock .screenlist{border-top:1px solid var(--line)}
.quietblock .screenlist button{font-size:13.5px;padding:7px 0;border-bottom-color:rgba(0,0,0,.06);
  display:flex;align-items:baseline;gap:8px}
:root:not([data-theme="light"]) .quietblock .screenlist button{border-bottom-color:rgba(255,255,255,.07)}
.quietblock .screenlist button[aria-current="true"]{font-weight:600}
.quietblock .here{font-style:italic;font-size:12px;color:var(--violet);white-space:nowrap}
.quietblock .toggle{margin-top:14px;font-size:13.5px}
.quietblock .toggle input{width:16px;height:16px}
.quietblock .hint{font-size:12.5px;margin-top:6px}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 24px;padding:0;list-style:none;font-size:15px}
.crumbs li+li::before{content:"/";color:var(--mid);margin-right:6px}
.crumbs button{background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--mid);text-align:left}
.crumbs li:last-child button{text-decoration:none;font-weight:600}
.screenlist{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.screenlist button{width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);
  padding:9px 0;cursor:pointer;font-size:15px;color:var(--muted)}
.screenlist button:hover{color:var(--ink)}
.screenlist button[aria-current="true"]{color:var(--violet);font-weight:600}
.testlist button{color:var(--ink)}
.screenlist .d1{padding-left:16px}.screenlist .d2{padding-left:32px}
.toggle{display:flex;align-items:center;gap:10px;margin-top:24px;font-size:15px;cursor:pointer}
.toggle input{accent-color:var(--violet);width:18px;height:18px}
.hint{font-size:14px;color:var(--muted);margin-top:8px;max-width:34ch}

/* Phone frame: S23 Ultra bezel proportions (body 78.1 x 163.4 mm around a 71 mm screen).
   --screen-ratio and --body-ratio are set per prototype from the real image sizes. */
.phone{
  position:relative;
  --sw:min(clamp(240px,30vw,360px), calc(76vh / var(--body-ratio)));
  --bezel-x:calc(var(--sw)*0.05);
  --bezel-y:calc(var(--sw)*0.08);
  width:calc(var(--sw) + var(--bezel-x)*2);
  max-width:100%;
  padding:var(--bezel-y) var(--bezel-x);
  background:#111013;
  border-radius:calc(var(--sw)*0.115);
  box-shadow:0 0 0 1px var(--mid);
}
.viewport{
  position:relative;width:100%;
  aspect-ratio:1 / var(--screen-ratio);
  border-radius:calc(var(--sw)*0.075);
  overflow-y:auto;overflow-x:hidden;background:#fff;scrollbar-width:none;
}
.viewport::-webkit-scrollbar{display:none}
.shot{position:relative;width:100%}
.shot > img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.shot.enter{animation:in .22s ease-out}
@keyframes in{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}

/* A slice shows one horizontal band of a tall export. Its track can be wider than the
   page, which is how the Bundles carousel scrolls sideways without moving the page. */
.slice{overflow:hidden;width:100%;scrollbar-width:none;position:relative}
.slice::-webkit-scrollbar{display:none}
.slice.sx{overflow-x:auto;-webkit-overflow-scrolling:touch}
.slice .track{position:relative}
.slice img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}

/* Test pin: glassy circle with a white centre dot and a 2s wave to draw the eye */
.pin{position:absolute;z-index:6;width:calc(var(--sw)*0.075);height:calc(var(--sw)*0.075);
  transform:translate(-50%,-50%);border-radius:50%;cursor:pointer;padding:0;border:0;
  /* Darkened glass rather than a white outline, so the white dot stays visible
     on light elements as well as dark ones. */
  background:rgba(18,18,20,.34);
  -webkit-backdrop-filter:blur(5px) saturate(1.3);backdrop-filter:blur(5px) saturate(1.3);
  box-shadow:0 2px 10px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.22);
  display:grid;place-items:center;transition:transform .15s ease,background .15s ease}
.pin::before{content:"";position:absolute;inset:0;border-radius:50%;
  border:2px solid rgba(255,255,255,.9);
  filter:drop-shadow(0 0 2px rgba(0,0,0,.55));
  animation:pinwave 2s cubic-bezier(.25,.6,.35,1) infinite}
.pin::after{content:"";width:30%;height:30%;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.35)}
@keyframes pinwave{
  0%{transform:scale(1);opacity:.75}
  70%{transform:scale(2.1);opacity:0}
  100%{transform:scale(2.1);opacity:0}}
.pin:hover{transform:translate(-50%,-50%) scale(1.14);background:rgba(18,18,20,.5)}
.pin[aria-pressed="true"]{background:var(--violet)}
.pin[aria-pressed="true"]::before{animation:none;opacity:0}
@media (prefers-reduced-motion:reduce){.pin::before{animation:none;opacity:.5}}

.testlist button{padding:11px 0}
.testlist .tname{display:block;font-size:15px;line-height:1.3}
.testlist button[aria-current="true"] .tname{color:var(--violet);font-weight:600}
.testlist .tmeta{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.testlist .chip{font-size:10.5px;font-weight:600;letter-spacing:.02em;padding:2px 6px;border-radius:999px}
.chip.win{background:#DCF3E6;color:#14603A}
.chip.lose{background:#FBE0E8;color:#8E1C3C}
.chip.incon{background:var(--line);color:var(--muted)}
:root:not([data-theme="light"]) .chip.win{background:#17402C;color:#8FE0B4}
:root:not([data-theme="light"]) .chip.lose{background:#43182A;color:#F4A3BD}

/* Overview dashboard */
.ov-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line);margin:0 0 14px;max-width:1100px}
.ov-stat{background:var(--panel);padding:20px 18px}
.ov-stat .n{display:block;font:400 clamp(30px,3.4vw,44px)/1 Anton,Impact,sans-serif;letter-spacing:.01em}
.ov-stat .k{display:block;font-size:13px;color:var(--muted);margin-top:8px;letter-spacing:.01em}
.ov-stat.total{background:var(--lilac)}
.ov-money{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line);margin:0 0 12px;max-width:1100px}
.ov-money .ov-stat .n{font-size:clamp(26px,3vw,38px)}
.ov-note{font-size:13px;color:var(--muted);max-width:74ch;margin:0 0 24px}
.ov-cta{display:inline-block;background:var(--ink);color:var(--bg);text-decoration:none;
  padding:12px 20px;border-radius:999px;font-size:14px;font-weight:600;margin:0 0 44px}
.ov-cta:hover{opacity:.88}
.ov-h{font:400 clamp(26px,3vw,34px)/1 Anton,Impact,sans-serif;text-transform:uppercase;
  letter-spacing:.02em;margin:0 0 6px}
.ov-sub{font-size:14px;color:var(--muted);margin:0 0 22px;max-width:70ch}
.ov-page{margin:0 0 34px;max-width:1100px}
.ov-page h3{display:flex;align-items:baseline;gap:10px;font-size:17px;font-weight:700;
  text-transform:uppercase;letter-spacing:.06em;margin:0 0 10px;padding-bottom:8px;
  border-bottom:2px solid var(--ink)}
.ov-page h3 .c{font-size:12px;font-weight:600;letter-spacing:0;color:var(--muted);text-transform:none}
.ov-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:baseline;
  padding:9px 0;border-bottom:1px solid var(--line)}
.ov-row .t{font-size:15px}
.ov-row .ids{color:var(--muted)}
.ov-row .idlink{color:var(--muted);text-decoration:underline;text-underline-offset:2px;
  text-decoration-color:var(--mid)}
.ov-row .idlink:hover{color:var(--violet);text-decoration-color:var(--violet)}
.ov-row .st{font-size:12px;font-weight:600;letter-spacing:.02em;padding:3px 9px;border-radius:999px;white-space:nowrap}
.st.b-active{background:#E4DCFF;color:#3E2A8C}
.st.b-finished{background:#DCF3E6;color:#14603A}
.st.b-other{background:var(--line);color:var(--muted)}
:root:not([data-theme="light"]) .st.b-active{background:#2E2748;color:#C4B4FF}
:root:not([data-theme="light"]) .st.b-finished{background:#17402C;color:#8FE0B4}
.ov-big{margin-top:16px;padding:14px 16px;background:rgba(0,0,0,.035);border:1px solid var(--line)}
:root:not([data-theme="light"]) .ov-big{background:rgba(255,255,255,.04)}
.ov-big .lbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;
  color:var(--muted);margin:0 0 6px}
.ov-big .ov-row:last-child{border-bottom:0}

/* Pins over an embedded page: positioned from the live element, clipped to the screen */
.pinlayer{position:absolute;inset:0;z-index:6;pointer-events:none}
.pinlayer .pin{pointer-events:auto}
.pin[hidden]{display:none}

/* Test details panel */
.testpanel{position:sticky;top:16px;border-left:1px solid var(--line);padding-left:24px;min-height:200px}
.testpanel .placeholder{color:var(--muted);font-size:15px;max-width:30ch}
.testpanel h2{font-size:22px;font-weight:600;letter-spacing:-.02em;margin:0 0 4px;line-height:1.2}
.testpanel .tid{font-size:13px;color:var(--muted);margin:0 0 18px}
.regions{display:flex;gap:10px;margin:0 0 20px;flex-wrap:wrap}
.region{flex:1 1 0;min-width:88px;border:1px solid var(--line);padding:12px 10px;text-align:center}
.region .cvr{font-size:26px;font-weight:600;letter-spacing:-.03em;line-height:1.1;display:block}
.region .cvr.up{color:#1B7F4B}.region .cvr.down{color:#B3234B}
.region .rlabel{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.region .verdict{display:inline-block;margin-top:8px;font-size:11px;font-weight:600;
  text-transform:uppercase;letter-spacing:.04em;padding:3px 8px;border-radius:999px}
.verdict.win{background:#DCF3E6;color:#14603A}
.verdict.lose{background:#FBE0E8;color:#8E1C3C}
.verdict.incon{background:var(--line);color:var(--muted)}
:root[data-theme="dark"] .verdict.win,:root:not([data-theme="light"]) .verdict.win{background:#17402C;color:#8FE0B4}
:root[data-theme="dark"] .verdict.lose,:root:not([data-theme="light"]) .verdict.lose{background:#43182A;color:#F4A3BD}
.testpanel .summary{font-size:15px;line-height:1.55;margin:0 0 18px}
.testpanel figure{margin:0 0 18px}
.testpanel figure img{display:block;width:100%;height:auto;max-height:420px;object-fit:contain;
  object-position:top;border:1px solid var(--line);background:var(--panel)}
.testpanel figcaption{font-size:13px;color:var(--muted);margin-top:8px}
.analysis{display:inline-block;background:var(--ink);color:var(--bg);text-decoration:none;
  padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600}
.analysis:hover{opacity:.88}
.analysis.pending{background:none;color:var(--muted);border:1px dashed var(--mid);cursor:default}
.nodata{font-size:15px;color:var(--muted);margin:0 0 18px}

.hot{position:absolute;background:transparent;border:0;padding:0;cursor:pointer;border-radius:6px;z-index:2}
.show-hot .hot,.flash .hot{background:rgba(98,67,185,.28);box-shadow:inset 0 0 0 2px #8B6FE0}
.flash .hot{transition:background .5s}

/* Clipping layer over the screen area, so anything sliding in or out is cropped
   by the screen edge instead of appearing on the bezel. */
.screen-clip{position:absolute;top:var(--bezel-y);left:var(--bezel-x);
  right:var(--bezel-x);bottom:var(--bezel-y);z-index:5;
  border-radius:calc(var(--sw)*0.075);overflow:hidden;pointer-events:none}

/* Sticky Add to bag: slides up once the intro copy reaches the top of the screen */
.atc-bar{position:absolute;left:0;right:0;bottom:0;
  transform:translateY(100%);transition:transform .26s cubic-bezier(.22,.7,.3,1);
  pointer-events:none}
.atc-bar.on{transform:translateY(0);pointer-events:auto}
.atc-bar button{display:block;width:100%;border:0;cursor:pointer;
  background:#252427;color:#fff;
  font-size:calc(var(--sw)*0.045);font-weight:600;letter-spacing:-.01em;
  padding:calc(var(--sw)*0.045) 0 calc(var(--sw)*0.055)}
.atc-bar button:hover{background:#34323A}
@media (prefers-reduced-motion:reduce){.atc-bar{transition:none}}

/* Phone plus anything that belongs under it */
.phonecol{display:flex;flex-direction:column;align-items:stretch;gap:12px}

/* A note that appears below the phone once the viewer reaches the bottom of the screen */
.scroll-note{align-self:stretch;
  background:var(--violet);color:#fff;border:0;border-radius:999px;cursor:pointer;
  padding:12px 16px;font-size:14px;font-weight:600;line-height:1.3;
  letter-spacing:-.01em;text-align:center;
  box-shadow:0 6px 18px rgba(98,67,185,.28);
  transform:translateY(-6px);
  opacity:0;pointer-events:none;transition:opacity .22s ease,transform .22s ease}
.scroll-note.on{opacity:1;transform:translateY(0);pointer-events:auto}
.scroll-note:hover{filter:brightness(1.08)}
@media (prefers-reduced-motion:reduce){.scroll-note{transition:none}}

/* Sticky CTA pinned inside the phone screen, clear of the bottom edge */
.sticky-cta{position:absolute;left:50%;transform:translateX(-50%);
  bottom:calc(var(--bezel-y) + var(--sw)*0.04);z-index:4;pointer-events:none;
  filter:drop-shadow(0 6px 18px rgba(0,0,0,.25))}
.sticky-cta img{display:block;width:100%;height:auto}

@media (prefers-reduced-motion:reduce){.shot.enter{animation:none}}

/* The product page is rendered at a real phone width (--embed-w) and scaled down to
   whatever the frame is, so its full width always fits however small the frame gets. */
.embed-frame{position:absolute;top:0;left:0;border:0;display:block;
  background:transparent;z-index:1;transform-origin:0 0}
.embed-fallback{position:absolute;inset:0;z-index:0;display:flex;flex-direction:column;gap:12px;
  align-items:center;justify-content:center;text-align:center;padding:24px;background:transparent}
.embed-fallback p{margin:0;font-size:14px;color:var(--muted);max-width:26ch}
.embed-fallback a{color:var(--violet)}
.side .meta{font-size:15px;margin:0 0 18px;max-width:34ch}
.side .meta a{color:var(--violet);word-break:break-word}
.empty{border:1px dashed var(--mid);padding:40px;max-width:62ch}
.empty h2{margin:0 0 8px;font-size:22px;font-weight:600}
.empty p{margin:0;color:var(--muted)}

@media (max-width:1100px){
  .proto.has-tests{grid-template-columns:minmax(0,1fr) auto;gap:28px}
  .proto.has-tests .testpanel{grid-column:1 / -1;border-left:0;border-top:1px solid var(--line);
    padding-left:0;padding-top:20px;position:static}
}
@media (max-width:900px){
  .proto{grid-template-columns:1fr;justify-items:center;gap:24px}
  .side{width:100%;max-width:420px;padding:0}
  .side.right{order:3}
  .phone{--sw:min(clamp(240px,70vw,340px), calc(72vh / var(--body-ratio)))}
}
</style>
</head>
<body>
<header>
  <h1>Flagship test results</h1>
  <nav class="tabs" role="tablist" aria-label="Pages">
    <button role="tab" data-tab="intro">Overview</button>
    <button role="tab" data-tab="pdp">PDP</button>
    <button role="tab" data-tab="home">Home</button>
    <button role="tab" data-tab="nav">Nav</button>
    <button role="tab" data-tab="plp">PLP</button>
    <button role="tab" data-tab="cart">Cart</button>
  </nav>
</header>

<main>
  <section id="intro" role="tabpanel"><div id="overview"></div></section>
  <section id="nav" role="tabpanel" hidden><div class="proto" data-proto="nav"></div></section>
  <section id="plp" role="tabpanel" hidden><div class="proto" data-proto="plp"></div></section>
  <section id="pdp" role="tabpanel" hidden>
    <div class="proto has-tests" data-embed-tests="pdp">
      <div class="side"></div>
      <div class="phone" data-embed data-src="prototype/product.html"
           data-atc-after="#intro" data-atc-click="#buy-card button.btn-primary" data-atc-label="Add to bag">
        <div class="viewport" style="overflow:hidden">
          <iframe class="embed-frame" title="Paris Hilton x Loop Engage product page"
            src="prototype/product.html"
            referrerpolicy="no-referrer-when-downgrade" scrolling="yes"></iframe>
          <div class="embed-fallback">
            <p>This viewer wouldn't load the embedded page.</p>
            <p><a href="https://loop-earplugs.github.io/flagship-prototype/product.html" target="_blank" rel="noopener">Open it in a new tab</a></p>
          </div>
        </div>
      </div>
      <div class="testpanel"></div>
    </div>
  </section>
  <section id="home" role="tabpanel" hidden>
    <div class="proto has-tests" data-embed-tests="home">
      <div class="side"></div>
      <div class="phone" data-embed data-src="prototype/index.html">
        <div class="viewport" style="overflow:hidden">
          <iframe class="embed-frame" title="Loop home page" src="prototype/index.html"
            referrerpolicy="no-referrer-when-downgrade" scrolling="yes"></iframe>
          <div class="embed-fallback">
            <p>This viewer wouldn't load the embedded page.</p>
            <p><a href="https://loop-earplugs.github.io/flagship-prototype/" target="_blank" rel="noopener">Open it in a new tab</a></p>
          </div>
        </div>
      </div>
      <div class="testpanel"></div>
    </div>
  </section>
  <section id="cart" role="tabpanel" hidden><div class="proto" data-proto="cart"></div></section>
</main>

<script>

ult": "Loser"}], "summary": "Removing the review count from PLP cards left click-through to product pages unchanged in every market, so the \u201ccount is clutter\u201d theory doesn't hold \u2014 it did nothing in EU and US, and the AUS conversion drop happened after the click, most likely a confound. Recommendation: keep the count on the cards.", "image": "", "caption": "", "link": "https://www.figma.com/board/JkcvQ76cPCHQ1WNvKa1xr6/CRO-share-results?node-id=258-374&t=cyujzcXwRGUDS8Ny-4", "pending": false}, "933/934/935": {"id": "933/934/935", "title": "GST - Sticky help me choose button", "regions": [{"cvr": "5.50%", "label": "EU CvR", "result": "Winner"}, {"cvr": "10.70%", "label": "US CvR", "result": "Winner"}, {"cvr": "-6.80%", "label": "AUS CvR", "result": "Loser"}], "summary": "A persistent \u201cHelp me choose\u201d button lifted purchase, order value and revenue per visitor strongly in EU (+5.5%) and US (+10.7%) by giving undecided shoppers a low-effort way out of choice overload; AUS didn't gain, most likely a headroom ceiling rather than a real reversal. Recommendation: implement in EU and US.", "image": "", "caption": "", "link": "https://www.figma.com/board/JkcvQ76cPCHQ1WNvKa1xr6/CRO-share-results?node-id=265-651&t=cyujzcXwRGUDS8Ny-4", "pending": false}, "963/964/965": {"id": "963/964/965", "title": "PLP entry page - \"What brings you here?\"", "regions": [], "summary": "", "image": "", "caption": "", "link": "", "pending": true}}}, "cart": {"screens": {"empty": {"src": "images/Cart-clean-screen_empty.png", "title": "Empty bag", "parent": null, "pw": 780, "ph": 1688, "iw": 780, "hot": [], "ratio": 2.164102564102564, "note": {"text": "Click here to test a cart with items", "to": "bag1"}, "pins": [{"l": 89.744, "t": 17.773, "test": "975/976/977"}]}, "bag1": {"src": "images/Cart-clean-screen_bag1.png", "title": "1 item in bag", "parent": "empty", "pw": 640, "ph": 1958, "iw": 640, "hot": [{"l": 65.469, "t": 71.859, "w": 24.531, "h": 4.086, "to": "bag2", "la ive"}], "summary": "The new cross-sell block cleared the do-no-harm bar in EU (+1.8% conversion, +2.9% revenue per user) and held steady in AUS (order value +1.6%); the USA dip (-1.4%) is confounded by a concurrent test that hid the Add button, so it isn't a fair read. Next step: retest with 15% off the cross-sell items.", "image": "", "caption": "", "link": "https://www.figma.com/board/JkcvQ76cPCHQ1WNvKa1xr6/CRO-share-results?node-id=550-35&t=REcKpDRJfCAHgUhm-1", "pending": false}, "960/961/962": {"id": "960/961/962", "title": "USP reassurance row", "regions": [{"cvr": "0.70%", "label": "EU CvR", "result": "Inconclusive"}, {"cvr": "3.00%", "label": "US CvR", "result": "Winner"}, {"cvr": "2.60%", "label": "AUS CvR", "result": "Winner"}], "summary": "USA (+3.0%) and AUS (+2.6%) came back clear winners; EU was flat on the primary metric but flagged a borderline dip in checkout rate (80% chance control beats variant) worth watching post-launch. Recommendation: implement across all three, monitoring EU checkout rate after rollout.", "image": "", "caption": "", "link": "https://www.figma.com/board/JkcvQ76cPCHQ1WNvKa1xr6/CRO-share-results?node-id=401-26&p=f&t=dLoQRoYBgOzTfDpv-0", "pending": false}, "957/958/959": {"id": "957/958/959", "title": "Native express payment button", "regions": [{"cvr": "2.70%", "label": "EU CvR", "result": "Winner"}, {"cvr": "3.50%", "label": "US CvR", "result": "Winner"}, {"cvr": "-7.30%", "label": "AUS CvR", "result": "Loser"}], "summary": "Native express pay lifted EU mobile conversion +2.7% and delivered the strongest cart win of the year in the US (+3.5% conversion, +4.7% revenue per user); the AUS result is unreadable \u2014 it ran on the wrong pages, on too small a sample, and was stopped early. The mechanic itself works, so AUS shouldn't hold up the flagship rollout, but needs a clean retest.", "image": "", "caption": "", "link": "", "pending": true}}}};
const EMBEDS = {"pdp": {"tests": {"919/920/921": {"id": "919/920/921", "title": "CTA Anchoring price & text", "regions": [{"cvr": "5.40%", "label": "EU CvR", "result": "Winner"}, {"cvr": "-2.30%", "label": "US CvR", "result": "Inconclusive"}], "summary": "CTA price-anchoring is an EU-only win (+5.4% conversion, +6.4% revenue per visitor): the US shows a real loss and AUS is an underpowered null. Recommendation: ship in EU only, hold US and AUS on control.", "image": "", "caption": "", "link": "https://www.figma.com/board/JkcvQ76cPCHQ1WNvKa1xr6/CRO-share-results?node-id=252-178&t=cyujzcXwRGUDS8Ny-4", "pending": false}, "925/926/928": {"id": "925/926/928", "title": "Needed review info", "regions": [{"cvr": "-1.30%", "label": "EU CvR", "result": "Loser"}, {"cvr": "3.20%", "label": "US CvR", "result": "Winner"}, {"cvr": "-0.18%", "label": "AUS CvR", "result": "Inconclusive"}], "summary": "The change won in the US (+3.2%) and lost in the EU (-1.3%) only because each market sells a different product mix \u2014 the products themselves behave identically in both \u2014 so this is a per-product display decision, not a market one; AUS was inconclusive on thin volumes. Recommendation: keep control while the per-product view is worked out.", "image": "", "caption": "", "link": "https://www.figma.com/board/JkcvQ76cPCHQ1WNvKa1xr6/CRO-share-results?node-id=253-240&t=cyujzcXwRGUDS8Ny-4", "pending": false}, "939/940/941": {"id": "939/940/941", "title": "Compare module design - Dream vs Quiet", "regions": [{"cvr": "0.40%", "label": "EU CvR", "result": "Inconclusive"}, {"cvr": "4.90%", "label": "US CvR", "result": "Winner"}, {"cvr": "1.30%", "label": "AUS CvR", "result": "Inconclusive"}], "summary": "USA is converting compare-module engagement into a real +4.9% purchase lift; EU drives 6.5x more engagement but hasn't yet converted into purchases; AUS trends the same direction as USA but needs more runway to confirm. Recommendation: implement the variant.", "image": "", "caption": "", const tabBtns=[...document.querySelectorAll('.tabs button')];
function showTab(id){
  if(!document.getElementById(id)) id='intro';
  tabBtns.forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===id));
  document.querySelectorAll('main > section').forEach(s=>s.hidden=s.id!==id);
  if(location.hash!=='#'+id) history.replaceState(null,'','#'+id);
}
tabBtns.forEach(b=>b.addEventListener('click',()=>showTab(b.dataset.tab)));
document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>showTab(b.dataset.go)));

function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}

function verdictClass(v){
  v=(v||'').toLowerCase();
  return v.startsWith('win')?'win':v.startsWith('los')?'lose':'incon';
}
function renderTest(right,tests,tid){
  const t=tests[tid]; if(!t) return;
  right.innerHTML='';
  const h=el('h2',null,t.title); right.appendChild(h);
  right.appendChild(el('p','tid','Test '+t.id));

  if(t.regions.length){
    const row=el('div','regions');
    t.regions.forEach(function(r){
      const box=el('div','region');
      const num=el('span','cvr',r.cvr);
      if(/^-/.test(r.cvr)) num.classList.add('down'); else if(parseFloat(r.cvr)>0) num.classList.add('up');
      box.appendChild(num);
      box.appendChild(el('span','rlabel',r.label));
      if(r.result) box.appendChild(el('span','verdict '+verdictClass(r.result),r.result));
      row.appendChild(box);
    });
    right.appendChild(row);
  }
  if(t.summary) right.appendChild(el('p','summary',t.summary));
  if(!t.regions.length && !t.summary)
    right.appendChild(el('p','nodata','Results for this test are still being analysed.'));

  if(t.imageSrc){
    const fig=document.createElement('figure');
    const im=new Image(); im.src=t.imageSrc; im.alt=t.caption||t.title; im.loading='lazy';
    fig.appendChild(im);
    if(t.caption){const c=document.createElement('figcaption');c.textContent=t.caption;fig.appendChild(c);}
    right.appendChild(fig);
  }
  if(t.link){
    const a=document.createElement('a'); a.className='analysis'; a.href=t.link;
    a.target='_blank'; a.rel='noopener'; a.textContent='View detailed analysis';
    right.appendChild(a);
  } else {
    const b=el('span','analysis pending','Detailed analysis in progress');
    right.appendChild(b);
  }
}



function mount(root,cfg){
  const showTest=function(tid){renderTest(right,cfg.tests,tid);};
  const S=cfg.screens;
  root.innerHTML='';
  const left=el('div','side'), mid=el('div','phone'), right=el('div','side right');
  mid.style.setProperty('--screen-ratio',cfg.ratio);
  mid.style.setProperty('--body-ratio',cfg.body);
  const vp=el('div','viewport');
  const stick=el('div','sticky-cta'); stick.hidden=true; stick.appendChild(new Image());
  mid.append(vp,stick);
  // The note lives under the phone, not on the screen, so it never covers content.
  const note=el('button','scroll-note'); note.hidden=true; note.type='button';
  const midcol=el('div','phonecol'); midcol.append(mid,note);
  let noteTo=null, onScroll=null;

  // Left column order: tests first, then where you are and the screen list.
  const hasTests = !!cfg.tests;
  let testList=null;

  if(hasTests){
    root.classList.add('has-tests');
    // Where each test's pin lives, so the list can jump straight to it.
    const homeScreen={};
    cfg.order.forEach(function(pair){
      (S[pair[0]].pins||[]).forEach(function(pin){
        if(!homeScreen[pin.test]) homeScreen[pin.test]=pair[0];
      });
    });
    left.append(el('h2','sechead','Jump to a test'));
    testList=el('ul','screenlist testlist'); left.appendChild(testList);
    Object.keys(homeScreen).forEach(function(tid){
      const t=cfg.tests[tid]; if(!t) return;
      const li=el('li'), b=el('button');
      b.dataset.test=tid;
      b.appendChild(el('span','tname',t.title));
      const meta=el('span','tmeta');
      if(t.regions.length){
        t.regions.forEach(function(r){
          meta.appendChild(el('span','chip '+verdictClass(r.result),r.label.replace(' CvR','')+' '+r.cvr));
        });
      } else meta.appendChild(el('span','chip incon', t.link? 'See analysis' : 'In analysis'));
      b.appendChild(meta);
      b.onclick=function(){ go(homeScreen[tid], tid); };
      li.appendChild(b); testList.appendChild(li);
    });
    left.append(el('p','hint','Circles on the screens mark sections that were tested. Tap one for the result.'));
    right.className='testpanel';
    right.innerHTML='';
    right.append(el('p','placeholder','Tap a circle on the screen to see what was tested there and how it performed.'));
  }

  const crumbs=null;   // breadcrumb removed; the screen list marks where you are
  const quiet=el('div','quietblock');
  quiet.append(el('h2','sechead sub','Jump to a screen'));
  const list=el('ul','screenlist'); quiet.appendChild(list);

  const lbl=el('label','toggle'), cb=document.createElement('input');
  cb.type='checkbox'; lbl.append(cb,document.createTextNode(' Show clickable areas'));
  quiet.append(lbl, el('p','hint',"Tap anywhere that isn't clickable and the clickable areas light up briefly."));
  left.appendChild(quiet);
  cb.addEventListener('change',()=>vp.classList.toggle('show-hot',cb.checked));

  root.append(left,midcol,right);

  function path(k){const p=[];while(k){p.unshift(k);k=S[k].parent;}return p;}

  function go(k,openTest){
    const s=S[k];
    const shot=el('div','shot enter');

    if(s.slices){
      const trackPct=s.iw/s.pw*100;
      s.slices.forEach(sl=>{
        const clip=el('div','slice'+(sl.sx?' sx':''));
        clip.style.aspectRatio=s.pw+' / '+sl.h;
        const track=el('div','track'); track.style.width=trackPct+'%';
        const img=new Image(); img.src=s.src; img.alt=''; img.setAttribute('aria-hidden','true');
        img.style.marginTop='-'+(sl.y0/s.iw*100)+'%';
        track.appendChild(img); clip.appendChild(track);
        shot.appendChild(clip);
      });
    }else{
      const img=new Image(); img.src=s.src; img.alt='Screen: '+s.title; shot.appendChild(img);
    }

    s.hot.forEach(h=>{
      const b=el('button','hot');
      b.style.cssText='left:'+h.l+'%;top:'+h.t+'%;width:'+h.w+'%;height:'+h.h+'%';
      b.setAttribute('aria-label',h.label); b.title=h.label;
      b.addEventListener('click',e=>{e.stopPropagation();go(h.to);});
      shot.appendChild(b);
    });
    (s.pins||[]).forEach(function(pin){
      const b=el('button','pin'); b.type='button';
      if(pin.own){
        // Sits inside one of our overlays (e.g. the sticky button) so it appears,
        // moves and hides exactly with it.
        const host=mid.querySelector(pin.own);
        if(!host) return;
        b.style.left='50%'; b.style.top='50%'; b.style.pointerEvents='auto';
      } else {
        b.style.left=pin.l+'%'; b.style.top=pin.t+'%';
      }
      const t=cfg.tests&&cfg.tests[pin.test];
      b.setAttribute('aria-label','Test result: '+(t?t.title:pin.test));
      b.title=t?t.title:pin.test;
      b.setAttribute('aria-pressed','false');
      b.dataset.test=pin.test;
      b.addEventListener('click',function(e){
        e.stopPropagation();
        mid.querySelectorAll('.pin').forEach(function(x){x.setAttribute('aria-pressed','false');});
        b.setAttribute('aria-pressed','true');
        if(testList) testList.querySelectorAll('button')
          .forEach(x=>x.setAttribute('aria-current', x.dataset.test===pin.test));
        showTest(pin.test);
      });
      if(pin.own) mid.querySelector(pin.own).appendChild(b); else shot.appendChild(b);
    });

    shot.addEventListener('click',()=>{shot.classList.add('flash');setTimeout(()=>shot.classList.remove('flash'),600);});

    vp.replaceChildren(shot); vp.scrollTop=0;

    if(s.sticky){
      stick.hidden=false; stick.style.width='calc(var(--sw) * '+(s.sticky.w/100)+')';
      const i=stick.querySelector('img'); i.src=s.sticky.src; i.alt='Help me choose';
    } else stick.hidden=true;

    // Scroll-triggered note: shows at the bottom of the screen, hides on the way back up.
    if(onScroll){ vp.removeEventListener('scroll',onScroll); onScroll=null; }
    note.classList.remove('on');
    if(s.note){
      note.hidden=false; note.textContent=s.note.text; noteTo=s.note.to;
      onScroll=function(){
        // While the tab is hidden every measurement is 0, which would read as
        // "scrolled to the bottom", so treat that as not-at-the-end.
        if(!vp.clientHeight || !vp.scrollHeight){ note.classList.remove('on'); return; }
        const atEnd = vp.scrollTop + vp.clientHeight >= vp.scrollHeight - 4;
        note.classList.toggle('on', atEnd);
      };
      vp.addEventListener('scroll',onScroll,{passive:true});
      // The image decides the scroll height, and the tab may still be hidden,
      // so re-check on load and whenever the viewport gets a real size.
      const im=shot.querySelector('img');
      if(im){ if(im.complete) setTimeout(onScroll,0); else im.addEventListener('load',onScroll); }
      if(window.ResizeObserver) new ResizeObserver(onScroll).observe(vp);
    } else { note.hidden=true; noteTo=null; }

    if(crumbs) crumbs.replaceChildren(...path(k).map(function(p){
      const li=el('li'),b=el('button',null,S[p].title);b.onclick=function(){go(p);};li.appendChild(b);return li;}));
    list.querySelectorAll('button').forEach(function(b){
      const on=b.dataset.k===k;
      b.setAttribute('aria-current',on);
      const mark=b.querySelector('.here');
      if(mark) mark.remove();
      if(on) b.appendChild(el('span','here','\u2190 You are here'));
    });

    if(openTest){
      const pin=mid.querySelector('.pin[data-test="'+CSS.escape(openTest)+'"]');
      if(pin) pin.setAttribute('aria-pressed','true');
      showTest(openTest);
    }
    if(testList) testList.querySelectorAll('button')
      .forEach(b=>b.setAttribute('aria-current', openTest? b.dataset.test===openTest : 'false'));
  }

  note.addEventListener('click',function(){ if(noteTo) go(noteTo); });

  cfg.order.forEach(function(pair){
    const k=pair[0],d=pair[1];
    const li=el('li'),b=el('button');
    b.appendChild(el('span','sname',S[k].title));
    b.dataset.k=k; b.className='d'+d; b.onclick=function(){go(k);}; li.appendChild(b); list.appendChild(li);
  });
  go(cfg.start);
}

  function row(t){

        a.title=(x.region? x.region+' \u2014 ':'')+'open the test card';
        ids.appendChild(a);
      } else ids.appendChild(document.createTextNode(x.id));

    left.appendChild(ids);
    r.appendChild(left);
    r.appendChild(el('span','st b-'+t.bucket, t.status||'\u2014'));
    return r;
  }
  d.pages.forEach(function(p){
    const sec=el('section','ov-page');
    const h=el('h3'); h.appendChild(document.createTextNode(p.name));
    h.appendChild(el('span','c',(p.regular.length+p.big.length)+' tests'));
    sec.appendChild(h);

      box.appendChild(el('p','lbl','The Big Tests'));
      p.big.forEach(function(t){box.appendChild(row(t));});

    }
    root.appendChild(sec);
  });

// Live pages embedded in the phone frame. Each is rendered at a real phone width
// and scaled down, because these pages' layouts break below 320px.
(function(){
  const EMBED_W=390;
  document.querySelectorAll('[data-embed]').forEach(function(phone){
    const proto=phone.closest('[data-embed-tests]');
    const ecfg=proto&&EMBEDS?EMBEDS[proto.dataset.embedTests]:null;
    phone.style.setProperty('--screen-ratio',2.141);
    phone.style.setProperty('--body-ratio',2.301);
    const f=phone.querySelector('.embed-frame'), vp=f.parentElement;
    function fit(){
      const w=vp.clientWidth, h=vp.clientHeight;
      if(!w||!h) return;
      const scale=w/EMBED_W;
      f.style.width=EMBED_W+'px';
      f.style.height=(h/scale)+'px';
      f.style.transform='scale('+scale+')';
    }
    fit();
    if(window.ResizeObserver) new ResizeObserver(fit).observe(vp);
    window.addEventListener('resize',fit);

    // Test annotations over the embedded page.
    if(ecfg){
      const side=proto.querySelector('.side'), panel=proto.querySelector('.testpanel');
      const layer=document.createElement('div'); layer.className='pinlayer';
      vp.appendChild(layer);
      panel.innerHTML='';
      panel.append(el('p','placeholder','Tap a circle on the page to see what was tested there and how it performed.'));

      const pins=[];
      side.innerHTML='';
      side.append(el('h2','sechead','Jump to a test'));
      const tlist=el('ul','screenlist testlist'); side.appendChild(tlist);
      ecfg.pins.forEach(function(cfgPin){
        const t=ecfg.tests[cfgPin.test]; if(!t) return;
        const b=el('button','pin'); b.type='button'; b.hidden=true;
        b.dataset.test=cfgPin.test;
        b.setAttribute('aria-label','Test result: '+t.title);
        b.title=t.title; b.setAttribute('aria-pressed','false');
        b.addEventListener('click',function(e){
          e.stopPropagation(); select(cfgPin.test);
        });
        layer.appendChild(b);
        pins.push({el:b,cfg:cfgPin});

        const li=el('li'), lb=el('button');
        lb.dataset.test=cfgPin.test;
        lb.appendChild(el('span','tname',t.title));
        const meta=el('span','tmeta');
        if(t.regions.length){
          t.regions.forEach(function(r){
            meta.appendChild(el('span','chip '+verdictClass(r.result),r.label.replace(' CvR','')+' '+r.cvr));
          });
        } else meta.appendChild(el('span','chip incon', t.link? 'See analysis' : 'In analysis'));
        lb.appendChild(meta);
        lb.onclick=function(){ scrollToTest(cfgPin.test); select(cfgPin.test); };
        li.appendChild(lb); tlist.appendChild(li);
      });
      side.append(el('p','hint','Circles on the page mark sections that were tested. Tap one for the result.'));
      side.append(el('h2','sechead spaced','About this page'));
      side.append(el('p','meta',ecfg.about||''));
      const lk=document.createElement('a'); lk.href=phone.dataset.src; lk.target='_blank';
      lk.rel='noopener'; lk.textContent='Open it in a new tab';
      const lp=el('p','meta'); lp.appendChild(lk); side.appendChild(lp);

      function select(tid){
        pins.forEach(function(p){ p.el.setAttribute('aria-pressed', p.cfg.test===tid); });
        tlist.querySelectorAll('button').forEach(function(b){ b.setAttribute('aria-current', b.dataset.test===tid); });
        renderTest(panel,ecfg.tests,tid);
      }
      function target(cfgPin,w){
        if(cfgPin.own) return phone.querySelector(cfgPin.own);
        let e=w.document.querySelector(cfgPin.sel);
        if(e&&cfgPin.closest) e=e.closest(cfgPin.closest)||e;
        return e;
      }
      function scrollToTest(tid){
        let w; try{ w=f.contentWindow; w.document; }catch(err){ return; }
        const pin=pins.find(function(p){return p.cfg.test===tid;}); if(!pin) return;
        if(pin.cfg.own){   // our own overlay, e.g. the sticky bar: scroll to where it shows
          const anchor=w.document.querySelector('#intro');
          if(anchor) w.scrollTo({top:w.scrollY+anchor.getBoundingClientRect().top+80,behavior:'smooth'});
          return;
        }
        const e=target(pin.cfg,w); if(!e) return;
        const r=e.getBoundingClientRect();
        const off = pin.cfg.section ? 40 : (r.height/2 - w.innerHeight/2);
        w.scrollTo({top:w.scrollY+r.top-(pin.cfg.section?60:Math.max(60,w.innerHeight/2-r.height/2)),behavior:'smooth'});
      }
      function place(){
        let w; try{ w=f.contentWindow; w.document; }catch(err){ return; }
        const scale=vp.clientWidth/EMBED_W, H=w.innerHeight, W=EMBED_W;
        pins.forEach(function(p){
          const e=target(p.cfg,w);
          if(!e){ p.el.hidden=true; return; }
          if(p.cfg.own){            // element in our page already, not the iframe
            const pr=phone.getBoundingClientRect(), vr=vp.getBoundingClientRect(), er=e.getBoundingClientRect();
            const visible=e.offsetParent!==null && er.bottom>vr.top+2 && er.top<vr.bottom-2;
            p.el.hidden=!visible;
            if(visible){
              p.el.style.left=(er.left+er.width/2-vr.left)+'px';
              p.el.style.top=(er.top+er.height/2-vr.top)+'px';
            }
            return;
          }
          const r=e.getBoundingClientRect();
          if(r.bottom<8 || r.top>H-8){ p.el.hidden=true; return; }
          p.el.hidden=false;
          const cx = p.cfg.section ? (W-26-(p.cfg.slot||0)*30) : (r.left+r.width/2);
          let cy = p.cfg.section ? Math.max(r.top+26, Math.min(r.bottom-26, 70))
                                 : (r.top+r.height/2);
          cy = Math.max(14, Math.min(H-14, cy));
          p.el.style.left=(cx*scale)+'px';
          p.el.style.top=(cy*scale)+'px';
        });
      }
      f.addEventListener('load',function(){
        let w; try{ w=f.contentWindow; w.document; }catch(err){ return; }
        w.addEventListener('scroll',place,{passive:true});
        w.addEventListener('resize',place);
        setInterval(place,400);      // catches lazy layout shifts in the page
        place();
      });
      if(window.ResizeObserver) new ResizeObserver(place).observe(vp);
    }

    // Sticky Add to bag. Shows once the element named by data-atc-after has reached
    // the top of the screen, which is necessarily past the buy box above it.
    const after=phone.dataset.atcAfter;
    if(!after) return;
    const clip=document.createElement('div'); clip.className='screen-clip';
    const bar=document.createElement('div'); bar.className='atc-bar';
    const btn=document.createElement('button'); btn.type='button';
    btn.textContent=phone.dataset.atcLabel||'Add to bag';
    bar.appendChild(btn); clip.appendChild(bar); phone.appendChild(clip);

    f.addEventListener('load',function(){
      let w;
      try{ w=f.contentWindow; w.document; }catch(e){ return; }  // cross-origin: leave it hidden
      const target=w.document.querySelector(after);
      if(!target) return;
      function update(){
        const past=target.getBoundingClientRect().top<=0;
        bar.classList.toggle('on',past);
      }
      w.addEventListener('scroll',update,{passive:true});
      w.addEventListener('resize',update);
      update();
      btn.addEventListener('click',function(){
        const sel=phone.dataset.atcClick;
        const real=sel && w.document.querySelector(sel);
        if(real) real.click();
      });
    });
  });
})();
showTab(location.hash.slice(1)||'intro');
</script>
</body>
</html>
